<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首頁</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #1f2d26;
      --muted: #617168;
      --primary: #1f6f50;
      --primary-dark: #17563e;
      --shadow: 0 16px 40px rgba(31, 45, 38, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(39, 130, 95, 0.18), transparent 34rem),
        linear-gradient(135deg, #f7faf8 0%, var(--bg) 100%);
    }

    main {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.15;
    }

    p {
      margin: 0 auto 32px;
      max-width: 32rem;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      min-height: 56px;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(31, 111, 80, 0.24);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .tool-button:hover,
    .tool-button:focus-visible {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(31, 111, 80, 0.3);
    }

    .tool-button:focus-visible {
      outline: 4px solid rgba(31, 111, 80, 0.22);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>歡迎使用碳盤查工具</h1>
    <p>點選下方按鈕即可前往碳盤查計算小工具，進行天數、質量平衡法及常用單位換算。</p>
    <a class="tool-button" href="GHG.html">計算小工具</a>
  </main>
</body>
</html>
